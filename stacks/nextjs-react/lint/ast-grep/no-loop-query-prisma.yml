# Heuristic N+1 detector for Prisma. Matches a `prisma.<model>.<queryFn>(...)`
# call whose ancestors (stopBy: end) include a for / for-of / for-in / while /
# do-while statement or a `.map(...)` callback. The receiver is matched
# literally as `prisma` - the overwhelmingly common binding name - because a
# metavariable receiver ($DB.$M.$FN) also matches unrelated 3-level chains;
# narrowing to `prisma` keeps the rule reliable in ast-grep 0.45.1. Query
# functions are limited to the row-returning/mutating set via a constraints
# regex. Note `Promise.all(ids.map(id => prisma...))` IS flagged: per catalog
# D1 the AST rule stays a coarse heuristic and is paired with the runtime
# query-count check, which is the authority on real round-trip counts.
id: no-loop-query-prisma
language: TypeScript
severity: error
message: "Heuristic: a Prisma query inside a loop or .map() callback usually multiplies DB round-trips (N+1). Batch it (findMany with an `in` filter, createMany, updateMany) - or, if this is intentional, verify with the paired runtime query-count check. (Catalog: D1)"
rule:
  kind: call_expression
  pattern: prisma.$MODEL.$FN($$$ARGS)
  inside:
    stopBy: end
    any:
      - kind: for_statement
      - kind: for_in_statement
      - kind: while_statement
      - kind: do_statement
      - kind: call_expression
        has:
          field: function
          kind: member_expression
          has:
            field: property
            regex: ^map$
constraints:
  FN:
    regex: ^(findUnique|findUniqueOrThrow|findFirst|findFirstOrThrow|findMany|create|update|upsert|delete)$
