// Pre-built PIT (Pitest) configuration for the java-springboot stack.
//
// This snippet is meant to be pulled into a product build with:
//     apply from: 'lint/mutation/pitest.gradle'
//
// Plugin application: the `info.solidsoft.pitest` plugin id must be declared in
// the ROOT build script `plugins { }` block, not here. Gradle forbids the
// `plugins { }` DSL inside a script applied via `apply from`, and a `buildscript`
// classpath in an applied script clashes with the root plugins block. So the
// product adds the plugin id in its own `plugins { }` (see the README), and this
// file only configures the `pitest { }` extension that the plugin registers,
// plus the two entry-point tasks `mutationFull` and `mutationDiff`.
//
// Requires Gradle 7.5+ (providers.exec).

import java.nio.file.Files
import java.nio.file.LinkOption
import java.nio.file.NoSuchFileException
import java.nio.file.Path
import java.nio.file.StandardCopyOption
import java.nio.file.attribute.BasicFileAttributes

pitest {
    // Pin the PIT core version. junit5PluginVersion 1.2.1 (below) requires PIT
    // core 1.16 or newer; the gradle-pitest-plugin's older default core (1.15.0)
    // crashes against it with NoSuchMethodError on TestUnitExecutionListener.
    // Pinning here keeps the JUnit 5 companion and core compatible regardless of
    // the plugin version the product happens to resolve. (Execution-verified
    // against a real Spring Boot project during phase 4.)
    pitestVersion = '1.16.1'

    // JUnit 5 support. Spring Boot tests run on JUnit 5 (Jupiter), so PIT needs
    // its JUnit 5 companion plugin to discover and run them.
    junit5PluginVersion = '1.2.1'

    // Write the analysis classpath to a file rather than the command line. On
    // Windows a large Spring classpath overflows the command-line length limit
    // (CreateProcess error=206); this avoids it and is harmless on other OSes.
    useClasspathFile = true

    // Scope of classes to mutate. lint-scaffolding replaces __BASE_PACKAGE__ with
    // the product base package (see the README). Full-scope by default; the
    // mutationDiff entry point below narrows this to the changed classes.
    targetClasses = ['__BASE_PACKAGE__.*']

    // Behaviour-changing mutators only: Conditionals Boundary, Negate
    // Conditionals, Math, Increments, Invert Negatives, Void Method Calls and
    // the Empty / False / True / Null Returns. This is PIT's own default group,
    // pinned here so the scope never silently widens to STRONGER / ALL.
    mutators = ['DEFAULTS']

    // Report formats. XML is the machine-readable report that quality-check parses
    // for the mutation score; HTML is for human inspection during local runs.
    outputFormats = ['XML', 'HTML']

    // Stable report path (no per-run timestamp folder) so the report reader
    // can find the latest XML at a fixed location.
    timestampedReports = false

    // Intentionally NOT setting mutationThreshold or any gate threshold here.
    // There is no score gate: the test-recommendation skill (quality-check
    // Step 5) reads the XML report, presents the score as reference
    // information and triages survivors with the user (quality-policy.md
    // section 2). Numbers must never be hardcoded in this build snippet.
}

// --- diff scope (applies ONLY when the mutationDiff task was requested) ------
// Gated on gradle.startParameter.taskNames, NOT on a taskGraph.whenReady
// listener (configuration-cache incompatible - on a cache hit the listener
// would not fire and the narrowing would silently not apply) and NOT on mere
// property presence (an ambient mutationDiffBase persisted in
// gradle.properties or via ORG_GRADLE_PROJECT_mutationDiffBase must never
// narrow mutationFull / plain `gradle pitest`, nor make unrelated builds
// shell out to git). Task names are part of the configuration-cache key, so
// this branch is cache-correct; the git output below is read through
// providers.exec and therefore revalidated on every build it applies to.
// Limitation: invoking the task through a Gradle name abbreviation skips this
// branch - the mutationDiff task then fails loudly via its guard below.
//
// Narrowing rules:
// - The scope is the production classes changed in the WORKING TREE against
//   the merge base of the base ref (uncommitted edits count - PIT mutates the
//   compiled state of the tree, matching the Stryker twin's behavior).
// - Each changed source maps to two targetClasses entries: the FQCN itself
//   and FQCN$* for inner/nested classes. A bare FQCN* would also match
//   unchanged sibling classes (OrderService* matching OrderServiceImpl).
//   Additional top-level package-private classes declared in the same file
//   under a different name are NOT covered - a documented limitation, see the
//   README.
// - targetTests is pinned to the FULL class scope before narrowing: PIT's
//   default derives the test filter from targetClasses, which would silently
//   drop every test class not named after the changed class and deflate the
//   score (verified against PIT 1.16.1).
// - failWhenNoMutations is switched off for EVERY diff run: changed classes
//   with no mutation point under DEFAULTS (interfaces, constants-only
//   classes) must complete as an empty scope, not fail the build
//   (quality-policy section 2). PIT 1.16.1 then logs "Skipping coverage and
//   analysis as no mutations found" and writes no XML.
// - An empty changed-class list disables the pitest task entirely: PIT is not
//   booted just to conclude nothing matched. quality-check records
//   `mutation.reason: "empty_scope"` for both empty cases.
// - The report directory is deleted before EVERY diff run (task
//   mutationDiffCleanReport, wired as a dependency of pitest): a diff run
//   that writes no XML would otherwise leave an earlier run's report in
//   place for quality-check to read as this run's result. A dependency, not
//   a doFirst, so it still runs on the empty scope - a disabled task skips
//   its own actions, its dependencies do not. The task refuses a reportDir
//   outside the module's build directory, and one reached through - or
//   holding - a junction or symlink (#159: checked on real paths, nothing
//   deleted on refusal), and moves reportDir aside as a whole before
//   deleting anything in it. Stryker's
//   twin only removes its report on the EMPTY scope: Stryker always rewrites
//   the report on a non-empty scope, PIT does not (no mutants = no XML).
def mutationDiffRequested = gradle.startParameter.taskNames.any {
    it == 'mutationDiff' || it.endsWith(':mutationDiff')
}
def mutationDiffScoped = false
if (mutationDiffRequested) {
    def mutationDiffBase = project.findProperty('mutationDiffBase')?.toString()
    if (!mutationDiffBase) {
        throw new org.gradle.api.GradleException('mutationDiff requires -PmutationDiffBase=<base ref>, e.g. -PmutationDiffBase=origin/main')
    }
    if (mutationDiffBase.startsWith('-')) {
        // A revision must never be able to smuggle a git option.
        throw new org.gradle.api.GradleException("mutationDiffBase must be a git revision, got: ${mutationDiffBase}")
    }
    def mergeBase
    try {
        mergeBase = providers.exec {
            workingDir = projectDir
            commandLine 'git', 'merge-base', mutationDiffBase, 'HEAD'
        }.standardOutput.asText.get().trim()
    } catch (Exception e) {
        throw new org.gradle.api.GradleException("[mutationDiff] cannot resolve the merge base of ${mutationDiffBase} and HEAD - is the base ref fetched? (git fetch origin main)", e)
    }
    def changedSources = providers.exec {
        workingDir = projectDir
        commandLine 'git', '-c', 'core.quotePath=false', 'diff', '--name-only',
                    '--no-ext-diff', '--no-color', '--relative', '--diff-filter=ACMRT',
                    mergeBase, '--', 'src/main/java'
    }.standardOutput.asText.get().readLines()
        .collect { it.trim() }
        .collect { line ->
            // Paths containing quotes or control bytes arrive C-quoted even
            // with core.quotePath=false; unquote so .java detection works.
            (line.startsWith('"') && line.endsWith('"'))
                ? line.substring(1, line.length() - 1).replace('\\"', '"').replace('\\\\', '\\')
                : line
        }
        .findAll { it.endsWith('.java') }
    def changedClasses = changedSources.collectMany { sourcePath ->
        def fqcn = sourcePath.replaceFirst(/^src\/main\/java\//, '')
                             .replaceFirst(/\.java$/, '')
                             .replace('/', '.')
        [fqcn, fqcn + '$*']
    }
    pitest.failWhenNoMutations = false
    def mutationDiffCleanReport = tasks.register('mutationDiffCleanReport') {
        group = 'verification'
        description = 'Removes the previous PIT report so a diff run that produces no mutants cannot pass it off as its own.'
        // The directory is deleted with everything in it and a product can
        // point reportDir anywhere, so refuse anything outside this module's
        // build directory (the plugin default is build/reports/pitest).
        // This lexical check fails early, at configuration; the real-path
        // checks below run when the task executes.
        def reportDirValue = pitest.reportDir.getOrNull()
        if (reportDirValue == null) {
            throw new GradleException('[mutationDiff] pitest.reportDir is not set - keep the plugin default (build/reports/pitest) or point it at a PIT-specific directory under build/')
        }
        def reportPath = reportDirValue.asFile.toPath().toAbsolutePath().normalize()
        def buildPath = layout.buildDirectory.get().asFile.toPath().toAbsolutePath().normalize()
        // Strictly below build/ and not build/reports itself: those hold
        // other tools' output too.
        if (!reportPath.startsWith(buildPath) || reportPath == buildPath || reportPath == buildPath.resolve('reports')) {
            throw new GradleException("[mutationDiff] pitest.reportDir (${reportPath}) is not a PIT-specific directory under the build directory (${buildPath}) - the diff run deletes it before every run; keep it below build/ and apart from build/reports itself (plugin default: build/reports/pitest)")
        }
        // Plain files only from here on: the action must not reach project
        // state (configuration cache).
        def reportDirFile = reportPath.toFile()
        def buildDirFile = buildPath.toFile()
        // #159: no Gradle Delete. It gives no guarantee to treat a Windows
        // junction as a link, so a junction INSIDE reportDir could carry the
        // recursive delete outside, and a junction ABOVE it (build/reports ->
        // elsewhere) passes the lexical check above. Three phases instead:
        // (1) inspect - reportDir must lie inside buildDir on REAL paths, and
        //     so must every entry below it inside reportDir; an entry that is
        //     a link, a junction or any other reparse point, resolves
        //     elsewhere, cannot be inspected or cannot be deleted stops the
        //     task with NOTHING deleted (and nothing moved), naming the entry.
        //     Links are never followed or unlinked, so no JVM's junction-delete
        //     semantics are relied on.
        // (2) move aside - reportDir is renamed in one atomic step to a unique
        //     quarantine name in its own parent (.<name>.helm-delete-<uuid>).
        //     Some delete denials cannot be seen beforehand (a file another
        //     process holds open without delete sharing, a directory that is
        //     another process's working directory, an ACL, a sticky
        //     directory); on Windows the first two also block the rename, so
        //     the task stops with reportDir untouched. If the rename fails for
        //     any reason, nothing was deleted.
        // (3) delete - the quarantine tree is inspected again under the same
        //     rules, then deleted deepest first with Files.delete. reportDir
        //     itself is already gone, so a delete that still fails here cannot
        //     leave a stale report behind; the task fails naming the
        //     quarantine directory that remains.
        // Leftover quarantine directories from an earlier failed run are left
        // alone (the simpler and safer choice: never delete what this run did
        // not inspect and move itself) and reported as a warning; `gradle
        // clean` or a manual delete removes them.
        // Containment: each existing path component must be a real directory
        // or file (no link, junction or other reparse point) whose real
        // parent IS the verified real parent (Files.isSameFile - an identity
        // check, never a case-insensitive name comparison, which a
        // case-sensitive directory on a case-insensitive OS would defeat).
        // The walk starts at realpath(root), never compares a whole real path
        // with a lexical one, so a build directory that itself sits under a
        // link (macOS /var -> /private/var) is not mistaken for "outside".
        // The report tree is walked iteratively (no recursion depth limit),
        // each entry checked once against its already verified parent.
        // Residual window, outside the threat model: between (1) and (2)
        // another local process with write access to reportDir could swap
        // an entry for a link; (3) re-inspects the moved tree and deletes only
        // what that inspection enumerated, one entry at a time.
        doLast { task ->
            def osName = System.getProperty('os.name').toLowerCase(Locale.ROOT)
            def isWindows = osName.contains('win')
            // A symbolic link, or any other reparse point / special file:
            // Windows reports a junction as "other", not as a symbolic link.
            def linkLike = { BasicFileAttributes attrs -> attrs.isSymbolicLink() || attrs.isOther() }
            // Verdict per path: 'ok', 'outside' (a link, junction or other
            // reparse point on the way, or a component that resolves
            // elsewhere) or 'error' (could not be inspected: permissions, IO,
            // or an entry that was listed but vanishes under its normalized
            // name). mustExist: only reportDir itself (and what lies below
            // build/ on the way to it) may be absent.
            def contained = { Path root, Path target, boolean mustExist ->
                try {
                    def lexicalRoot = root.toAbsolutePath().normalize()
                    def relative = lexicalRoot.relativize(target.toAbsolutePath().normalize())
                    if (relative.toString().isEmpty()) return 'ok'
                    if (relative.getName(0).toString() == '..') return 'outside'
                    def real = lexicalRoot.toRealPath()
                    def lexical = lexicalRoot
                    for (int i = 0; i < relative.nameCount; i++) {
                        lexical = lexical.resolve(relative.getName(i).toString())
                        def attrs
                        try {
                            attrs = Files.readAttributes(lexical, BasicFileAttributes, LinkOption.NOFOLLOW_LINKS)
                        } catch (NoSuchFileException ignored) {
                            return mustExist ? 'error' : 'ok' // absent: nothing below can redirect
                        }
                        if (linkLike(attrs)) return 'outside'
                        def next = lexical.toRealPath()
                        if (next.parent == null || !Files.isSameFile(next.parent, real)) return 'outside'
                        real = next
                    }
                    return 'ok'
                } catch (Exception ignored) {
                    return 'error' // permissions / IO: not inspectable
                }
            }
            // Entries that cannot be deleted would stop the deletes partway;
            // find the detectable ones up front. Windows: the read-only
            // attribute (never followed). POSIX: deleting needs a writable
            // parent directory.
            def undeletable = { Path entry ->
                try {
                    if (isWindows) {
                        return Files.getAttribute(entry, 'dos:readonly', LinkOption.NOFOLLOW_LINKS) == Boolean.TRUE
                    }
                    def parent = entry.parent
                    return parent != null && !Files.isWritable(parent)
                } catch (Exception ignored) {
                    return true
                }
            }
            // Inspects the tree below `top` (real path `topReal`) without
            // following anything, iteratively. Returns the findings and every
            // entry in pre-order (each directory before its contents).
            def scan = { Path top, Path topReal ->
                def result = [outside: [], uninspectable: [], locked: [], entries: []]
                def stack = new ArrayDeque<List>()
                stack.push([top, topReal])
                while (!stack.isEmpty()) {
                    def frame = stack.pop()
                    Path dir = frame[0]
                    Path dirReal = frame[1]
                    def children
                    try {
                        children = Files.list(dir).withCloseable { it.collect(java.util.stream.Collectors.toList()) }
                    } catch (Exception ignored) {
                        result.uninspectable << dir
                        continue
                    }
                    for (Path entry : children) {
                        BasicFileAttributes attrs
                        Path entryReal = null
                        boolean inside = false
                        try {
                            attrs = Files.readAttributes(entry, BasicFileAttributes, LinkOption.NOFOLLOW_LINKS)
                            if (!linkLike(attrs)) {
                                entryReal = entry.toRealPath()
                                inside = entryReal.parent != null && Files.isSameFile(entryReal.parent, dirReal)
                            }
                        } catch (Exception ignored) {
                            result.uninspectable << entry
                            continue
                        }
                        if (!inside) {
                            result.outside << entry
                            continue
                        }
                        if (undeletable(entry)) {
                            result.locked << entry
                        }
                        result.entries << entry
                        if (attrs.isDirectory()) {
                            stack.push([entry, entryReal])
                        }
                    }
                }
                return result
            }
            // Inspects `target` (reportDir, or its quarantine) as a whole.
            def inspectTree = { Path target ->
                def verdict = contained(buildDirFile.toPath(), target, true)
                if (verdict != 'ok') {
                    return [verdict: verdict]
                }
                def tree
                try {
                    def attrs = Files.readAttributes(target, BasicFileAttributes, LinkOption.NOFOLLOW_LINKS)
                    tree = attrs.isDirectory()
                        ? scan(target, target.toRealPath())
                        : [outside: [], uninspectable: [], locked: [], entries: []]
                } catch (Exception ignored) {
                    return [verdict: 'error']
                }
                if (undeletable(target)) {
                    tree.locked << target
                }
                tree.verdict = 'ok'
                return tree
            }
            def report = reportDirFile.toPath()
            def quarantinePrefix = ".${report.fileName}.helm-delete-"
            try {
                def leftovers = Files.list(report.parent).withCloseable { stream ->
                    stream.collect(java.util.stream.Collectors.toList())
                }.findAll { it.fileName.toString().startsWith(quarantinePrefix) }
                if (!leftovers.isEmpty()) {
                    task.logger.warn("[mutationDiff] left alone: ${leftovers.join(', ')} - an earlier cleanup of pitest.reportDir could not finish deleting it. It is not a report PIT or quality-check reads; remove it by hand (or run the clean task).")
                }
            } catch (Exception ignored) {
                // no parent directory yet, or unreadable: nothing to report
            }
            try {
                Files.readAttributes(report, BasicFileAttributes, LinkOption.NOFOLLOW_LINKS)
            } catch (NoSuchFileException ignored) {
                return // no previous report: nothing to do
            } catch (IOException e) {
                throw new GradleException("[mutationDiff] pitest.reportDir (${report}) could not be inspected - nothing was deleted: ${e}", e)
            }
            def reportVerdict = contained(buildDirFile.toPath(), report, false)
            if (reportVerdict == 'error') {
                throw new GradleException("[mutationDiff] pitest.reportDir (${report}) or a directory on the way to it could not be inspected (permission or I/O error) - nothing was deleted.")
            }
            if (reportVerdict != 'ok') {
                throw new GradleException("[mutationDiff] pitest.reportDir (${report}) resolves outside the build directory (${buildDirFile}) through a link or junction - nothing was deleted. The directories between the build directory and reportDir (build/reports) must be real directories, not links, junctions or other reparse points.")
            }
            def found = inspectTree(report)
            if (found.verdict != 'ok') {
                throw new GradleException("[mutationDiff] pitest.reportDir (${report}) could not be inspected (permission or I/O error) - nothing was deleted.")
            }
            if (!found.outside.isEmpty()) {
                throw new GradleException("[mutationDiff] pitest.reportDir (${report}) contains entries that resolve outside it (a junction, symbolic link or other reparse point): ${found.outside.join(', ')} - nothing was deleted. Remove them by hand and re-run.")
            }
            if (!found.uninspectable.isEmpty()) {
                throw new GradleException("[mutationDiff] pitest.reportDir (${report}) contains entries that could not be inspected: ${found.uninspectable.join(', ')} - nothing was deleted. Fix or remove them by hand and re-run.")
            }
            if (!found.locked.isEmpty()) {
                throw new GradleException("[mutationDiff] pitest.reportDir (${report}) contains entries that cannot be deleted (read-only or in a non-writable directory): ${found.locked.join(', ')} - nothing was deleted. Fix their permissions or remove them by hand and re-run.")
            }
            def quarantine = report.resolveSibling(quarantinePrefix + UUID.randomUUID())
            try {
                Files.move(report, quarantine, StandardCopyOption.ATOMIC_MOVE)
            } catch (Exception e) {
                throw new GradleException("[mutationDiff] pitest.reportDir (${report}) could not be moved aside for deletion (on Windows: a file in it is open in another process, or a directory in it is another process's working directory): ${e} - nothing was deleted. Close that process and re-run.", e)
            }
            def moved = inspectTree(quarantine)
            if (moved.verdict != 'ok' || !moved.outside.isEmpty() || !moved.uninspectable.isEmpty() || !moved.locked.isEmpty()) {
                def offending = moved.verdict != 'ok' ? [quarantine] : (moved.outside + moved.uninspectable + moved.locked)
                throw new GradleException("[mutationDiff] pitest.reportDir (${report}) was moved aside to ${quarantine}, but it changed after the inspection (${offending.join(', ')}) - nothing in it was deleted. pitest.reportDir itself is gone, so no stale report remains; remove ${quarantine} by hand.")
            }
            def current = null
            try {
                for (Path entry : moved.entries.reverse()) {
                    current = entry
                    Files.delete(entry)
                }
                current = quarantine
                Files.delete(quarantine)
            } catch (Exception e) {
                throw new GradleException("[mutationDiff] pitest.reportDir (${report}) was moved aside to ${quarantine}, but deleting it stopped at ${current}: ${e} - pitest.reportDir itself is gone, so no stale report remains; remove ${quarantine} by hand.", e)
            }
        }
    }
    tasks.named('pitest').configure { dependsOn(mutationDiffCleanReport) }
    if (changedClasses.isEmpty()) {
        logger.warn("[mutationDiff] empty scope: no production classes changed since ${mutationDiffBase} - nothing to mutate")
        tasks.named('pitest').configure { enabled = false }
    } else {
        logger.lifecycle("[mutationDiff] base ${mutationDiffBase}: ${changedClasses.size() / 2} changed class(es) in scope")
        pitest.targetTests = pitest.targetClasses.get()
        pitest.targetClasses = changedClasses
    }
    mutationDiffScoped = true
}

// --- entry points ------------------------------------------------------------
// Task names cannot contain ':' (Gradle's project-path separator), hence
// mutationFull / mutationDiff rather than the JS-side mutation:full /
// mutation:diff script names.
tasks.register('mutationFull') {
    group = 'verification'
    description = 'Full-scope PIT run over every class under targetClasses.'
    dependsOn 'pitest'
}

tasks.register('mutationDiff') {
    group = 'verification'
    description = 'Diff-scoped PIT run: gradle mutationDiff -PmutationDiffBase=origin/main'
    dependsOn 'pitest'
    doFirst {
        // Fail-safe for the task-name gate above: reaching this task without
        // the narrowing applied (e.g. via a Gradle task-name abbreviation)
        // must fail loudly rather than pass a full-scope run off as a diff.
        if (!mutationDiffScoped) {
            throw new org.gradle.api.GradleException('mutationDiff ran without its diff scope applied - invoke it by its full name: gradle mutationDiff -PmutationDiffBase=origin/main')
        }
    }
}
