name: Publish to npm

# Single source of truth for both automated and manual npm releases.
#
# Automated path: push to main -> release-please job opens / merges
#   release PR -> verify, pack and publish jobs run in the same workflow.
# Manual path:    'gh workflow run publish.yml -f publish_tag=vX.Y.Z'
#   skips the release-please step and publishes the existing tag directly.
#
# Why one file: npm Trusted Publishing allows only one trusted publisher
# per package, and the OIDC subject claim must match the workflow filename.
# Inlining publish here avoids reusable-workflow incompatibility and keeps
# manual recoveries on the same trusted-publisher path.
#
# Hardening (3.7.2, #234):
# - No permission at the top level; each job states its own. Only publish
#   holds id-token: write.
# - The tests (and every third-party package they load) run in verify, which
#   has no id-token. publish installs no dependency: npm publish needs none.
# - The runtime dependencies are bundled into the tarball (bundleDependencies,
#   3.8.0, #248), so the transitive versions that npx installs are the ones
#   in package-lock.json. npm 12.2.1 has no `npm shrinkwrap`, so bundling is
#   the way to pin them. The tarball that is published is built in its own
#   job (pack), where no third-party code has run: it installs only the
#   runtime dependencies without scripts, packs, and compares the bundled
#   files with package-lock.json. publish takes exactly that file. A tag
#   from before 3.8.0 bundles nothing and is packed and published as before.
# - A vulnerability in a bundled dependency (@iarna/toml, yargs and what
#   they bring) reaches users only through a new release: fix the lock,
#   commit it as 'fix(deps):' and release it with release-please (see
#   CONTRIBUTING.md). Until then users keep the version they have.
# - There is no publish without provenance. A failed publish whose Sigstore
#   tlog entry already exists ends successfully only when the version is
#   already on npm; otherwise it stops: release the next patch version.
# - Expressions reach run: scripts only through env:, and the tag must be
#   v<semver>.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Optional: existing tag to publish (skips release-please). e.g. v1.3.4'
        required: false
        type: string

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The job always runs (so verify's needs is met on the manual path too);
      # only the step is skipped when a tag is given.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: ${{ inputs.publish_tag == '' || inputs.publish_tag == null }}
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  verify:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Resolve target tag
        id: target
        env:
          INPUT_TAG: ${{ inputs.publish_tag }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          TAG="${INPUT_TAG:-$RELEASE_TAG}"
          SEMVER_TAG='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [ -z "$TAG" ]; then
            echo "::error::No tag resolved"
            exit 1
          fi
          if ! [[ "$TAG" =~ $SEMVER_TAG ]]; then
            echo "::error::The tag is not v<semver>"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ steps.target.outputs.tag }}
          persist-credentials: false

      - name: Record the tested commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          check-latest: true

      - name: Verify version matches tag
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Verified: $TAG matches package.json $PKG_VERSION"

      - name: Install dependencies
        # --ignore-scripts: no dependency's install script runs. The only one in
        # the lock is @ast-grep/cli's postinstall (it swaps its JS shim for the
        # native binary); the tests resolve the platform package's binary first.
        # legacy-peer-deps: eslint-plugin-react's published peer range caps at
        # eslint@<=9.7 while dev tooling pins eslint@^10 (works under flat config;
        # npm's strict resolver refuses regardless). Kept as an explicit flag so
        # recovery publishes of tags cut before the repo .npmrc landed still
        # install. eslint* are devDependencies; runtime deps are unaffected.
        run: npm ci --ignore-scripts --legacy-peer-deps

      - name: Run tests
        run: npm test

  pack:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    steps:
      - name: Check the tag
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          SEMVER_TAG='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$TAG" =~ $SEMVER_TAG ]]; then
            echo "::error::The tag is not v<semver>"
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - name: Check the commit is the one verify tested
        env:
          TESTED: ${{ needs.verify.outputs.sha }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" != "$TESTED" ]; then
            echo "::error::The tag moved after verify ($TESTED -> $HEAD_SHA)"
            exit 1
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          check-latest: true

      - name: Install the runtime dependencies only
        run: npm ci --omit=dev --ignore-scripts --legacy-peer-deps

      - name: Pack the tarball
        run: |
          mkdir dist-tarball
          npm pack --ignore-scripts --pack-destination dist-tarball

      - name: Check the bundled files against package-lock.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TARBALL="dist-tarball/crearize-ai-dev-helm-${VERSION}.tgz"
          if [ ! -f "$TARBALL" ]; then
            echo "::error::$TARBALL was not created"
            exit 1
          fi
          UNPACKED="$RUNNER_TEMP/unpacked"
          mkdir "$UNPACKED"
          tar -xzf "$TARBALL" -C "$UNPACKED"
          cat > "$RUNNER_TEMP/check-bundle.js" <<'EOF'
          const fs = require('fs');
          const path = require('path');
          const [root, unpacked] = process.argv.slice(2);
          const pkg = JSON.parse(fs.readFileSync(path.join(root, 'package.json'), 'utf8'));
          const lock = JSON.parse(fs.readFileSync(path.join(root, 'package-lock.json'), 'utf8'));
          const bundled = pkg.bundleDependencies || [];
          if (bundled.length === 0) {
            console.log('Nothing is bundled (a tag from before 3.8.0).');
            process.exit(0);
          }
          const base = path.join(unpacked, 'package');
          const found = new Map();
          const walk = (rel) => {
            for (const e of fs.readdirSync(path.join(base, rel), { withFileTypes: true })) {
              if (!e.isDirectory() || e.name === '.bin') continue;
              const r = `${rel}/${e.name}`;
              if (e.name.startsWith('@')) { walk(r); continue; }
              const f = path.join(base, r, 'package.json');
              if (!fs.existsSync(f)) continue;
              found.set(r, JSON.parse(fs.readFileSync(f, 'utf8')).version);
              if (fs.existsSync(path.join(base, r, 'node_modules'))) walk(`${r}/node_modules`);
            }
          };
          if (fs.existsSync(path.join(base, 'node_modules'))) walk('node_modules');
          const expected = new Map();
          for (const [k, v] of Object.entries(lock.packages)) {
            if (k !== '' && !v.dev && k.startsWith('node_modules/')) expected.set(k, v.version);
          }
          const problems = [];
          for (const name of bundled) if (!found.has(`node_modules/${name}`)) problems.push(`${name} is not bundled`);
          for (const [k, v] of expected) if (found.get(k) !== v) problems.push(`${k}: lock ${v}, tarball ${found.get(k) || 'missing'}`);
          for (const [k, v] of found) if (!expected.has(k)) problems.push(`${k}@${v} is in the tarball but not in the lock`);
          if (problems.length > 0) {
            for (const p of problems) console.log(`::error::${p}`);
            process.exit(1);
          }
          console.log(`The ${found.size} bundled packages match package-lock.json.`);
          EOF
          node "$RUNNER_TEMP/check-bundle.js" . "$UNPACKED"

      - name: Record the digest of the tarball
        id: digest
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "sha256=$(sha256sum "dist-tarball/crearize-ai-dev-helm-${VERSION}.tgz" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-tarball
          path: dist-tarball/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [verify, pack]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check the tag
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          SEMVER_TAG='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$TAG" =~ $SEMVER_TAG ]]; then
            echo "::error::The tag is not v<semver>"
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - name: Check the commit is the one verify tested
        env:
          TESTED: ${{ needs.verify.outputs.sha }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" != "$TESTED" ]; then
            echo "::error::The tag moved after verify ($TESTED -> $HEAD_SHA)"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package-tarball
          path: dist-tarball

      - name: Check the downloaded tarball is the one pack made
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          EXPECTED: ${{ needs.pack.outputs.sha256 }}
        run: |
          ACTUAL=$(sha256sum "dist-tarball/crearize-ai-dev-helm-${TAG#v}.tgz" | cut -d ' ' -f 1)
          if [ -z "$EXPECTED" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::The downloaded tarball ($ACTUAL) is not the one pack made ($EXPECTED)"
            exit 1
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '26'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm 11.5.1+. 12.2.1 is the version that
      # published 3.7.1; change it on purpose, not through @latest.
      - name: Install a fixed npm for Trusted Publishing
        run: |
          npm install -g npm@12.2.1 --ignore-scripts
          npm --version

      - name: Publish to npm (Trusted Publishing / OIDC, with provenance)
        env:
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set +e
          npm publish "./dist-tarball/crearize-ai-dev-helm-${TAG#v}.tgz" --access public --provenance --ignore-scripts 2>&1 | tee publish.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          # npm can create the Sigstore tlog entry before the registry publish
          # fails, and a retry with --provenance then hits the immutable tlog
          # entry. A version without provenance is never published: if the
          # version is already on npm the publish is complete; otherwise stop.
          if ! grep -q 'TLOG_CREATE_ENTRY_ERROR' publish.log; then
            exit "$status"
          fi

          VERSION=$(node -p "require('./package.json').version")
          if npm view "@crearize/ai-dev-helm@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION is already published on npm; treating publish as complete."
            exit 0
          fi

          echo "::error::The provenance tlog entry for $VERSION exists but $VERSION is not on npm. Do not publish it without provenance: release the next patch version instead."
          exit "$status"
