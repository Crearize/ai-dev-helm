name: Publish to npm

# Single source of truth for both automated and manual npm releases.
#
# Automated path: push to main -> release-please job opens / merges
#   release PR -> publish job runs in the same workflow.
# Manual path:    'gh workflow run publish.yml -f publish_tag=vX.Y.Z'
#   skips release-please and publishes the existing tag directly.
#
# Why one file: npm Trusted Publishing allows only one trusted publisher
# per package, and the OIDC subject claim must match the workflow filename.
# Inlining publish here avoids reusable-workflow incompatibility and keeps
# manual recoveries on the same trusted-publisher path.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_tag:
        description: 'Optional: existing tag to publish (skips release-please). e.g. v1.3.4'
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        if: ${{ inputs.publish_tag == '' || inputs.publish_tag == null }}
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || inputs.publish_tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Resolve target tag
        id: target
        run: |
          TAG="${{ inputs.publish_tag || needs.release-please.outputs.tag_name }}"
          if [ -z "$TAG" ]; then
            echo "::error::No tag resolved"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.target.outputs.tag }}

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm 11.5.1+ for Trusted Publishing
        run: npm install -g npm@latest

      - name: Verify version matches tag
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          TAG_VERSION="${TAG#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Verified: $TAG matches package.json $PKG_VERSION"

      - name: Install dependencies
        # legacy-peer-deps: eslint-plugin-react's published peer range caps at
        # eslint@<=9.7 while dev tooling pins eslint@^10 (works under flat config;
        # npm's strict resolver refuses regardless). Kept as an explicit flag so
        # recovery publishes of tags cut before the repo .npmrc landed still
        # install. eslint* are devDependencies; runtime deps are unaffected.
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test

      - name: Publish to npm (Trusted Publishing / OIDC)
        run: |
          set +e
          npm publish --access public --provenance 2>&1 | tee publish.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          # npm can create the Sigstore tlog entry before the registry publish
          # fails. Retrying with --provenance then hits the immutable tlog entry.
          # Only use the non-provenance recovery path for that exact failure and
          # only when the target package version is still absent from npm.
          if ! grep -q 'TLOG_CREATE_ENTRY_ERROR' publish.log; then
            exit "$status"
          fi

          VERSION=$(node -p "require('./package.json').version")
          if npm view "@crearize/ai-dev-helm@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION is already published on npm; treating publish as complete."
            exit 0
          fi

          echo "Recovering from npm provenance tlog conflict by publishing $VERSION without provenance."
          npm publish --access public
