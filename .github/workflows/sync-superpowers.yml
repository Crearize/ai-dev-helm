name: Sync Superpowers Skills

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Get current synced version
        id: current
        run: |
          if [ -f .superpowers-version ]; then
            echo "version=$(cat .superpowers-version)" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Get latest superpowers release
        id: latest
        run: |
          LATEST=$(gh api repos/obra/superpowers/releases \
            --jq '[.[] | select(.prerelease == false and .draft == false)][0].tag_name' \
            | sed 's/^v//')
          if [ -z "$LATEST" ]; then
            echo "::error::Failed to get latest release version"
            exit 1
          fi
          echo "version=$LATEST" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if update needed
        id: check
        run: |
          if [ "$CURRENT_VERSION" = "$LATEST_VERSION" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date: v$CURRENT_VERSION"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Update available: v$CURRENT_VERSION → v$LATEST_VERSION"
          fi
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
          LATEST_VERSION: ${{ steps.latest.outputs.version }}

      - name: Clone superpowers
        if: steps.check.outputs.needed == 'true'
        run: |
          if ! git clone --depth 1 --branch "v${LATEST_VERSION}" \
            https://github.com/obra/superpowers.git /tmp/superpowers; then
            echo "::error::Failed to clone superpowers v${LATEST_VERSION}"
            exit 1
          fi
        env:
          LATEST_VERSION: ${{ steps.latest.outputs.version }}

      - uses: actions/setup-node@v4
        if: steps.check.outputs.needed == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Transform and copy skills
        id: transform
        if: steps.check.outputs.needed == 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/transform-skills.sh             /tmp/superpowers/skills             skills/superpowers 2>&1 | tee /tmp/transform.log

      - name: Report upstream drift
        if: steps.check.outputs.needed == 'true' && steps.transform.outcome == 'failure'
        run: |
          TITLE="superpowers upstream drift v${LATEST_VERSION}"
          {
            echo "上流 superpowers v${LATEST_VERSION} の同期で、ハーネスが持つ overlay の基にした上流ファイルが変わっていました。"
            echo
            echo "対応: scripts/skill-overlays/README.md の手順で、差分を読んで overlay に取り込み、manifest を更新してください。"
            echo
            echo "実行ログ: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '~~~'
            tail -n 40 /tmp/transform.log
            echo '~~~'
          } > /tmp/drift-body.md
          EXISTING=$(gh issue list --state open --label superpowers-sync --json number,title --jq '[.[] | select(.title | startswith("superpowers upstream drift"))][0].number')
          if [ -n "$EXISTING" ]; then
            gh issue edit "$EXISTING" --title "$TITLE" --body-file /tmp/drift-body.md
          else
            gh issue create --title "$TITLE" --label superpowers-sync --body-file /tmp/drift-body.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LATEST_VERSION: ${{ steps.latest.outputs.version }}

      - name: Verify overlay reproduction and drift detection
        if: steps.check.outputs.needed == 'true' && steps.transform.outcome == 'success'
        run: |
          npm ci
          npx vitest run lib/skill-transform.test.js

      - name: Verify transformed skills
        if: steps.check.outputs.needed == 'true' && steps.transform.outcome == 'success'
        run: |
          SKILL_COUNT=$(find skills/superpowers -name "SKILL.md" | wc -l)
          if [ "$SKILL_COUNT" -ne 14 ]; then
            echo "::error::Expected 14 skills after transformation, got $SKILL_COUNT"
            exit 1
          fi
          echo "Verified: $SKILL_COUNT skills found"

      - name: Update version file
        if: steps.check.outputs.needed == 'true' && steps.transform.outcome == 'success'
        run: |
          echo "$LATEST_VERSION" > .superpowers-version
        env:
          LATEST_VERSION: ${{ steps.latest.outputs.version }}

      - name: Create Pull Request
        if: steps.check.outputs.needed == 'true' && steps.transform.outcome == 'success'
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          title: "fix(superpowers): sync skills v${{ steps.current.outputs.version }} → v${{ steps.latest.outputs.version }}"
          body: |
            ## superpowers スキル自動同期

            **更新**: v${{ steps.current.outputs.version }} → v${{ steps.latest.outputs.version }}

            [リリースノート](https://github.com/obra/superpowers/releases/tag/v${{ steps.latest.outputs.version }})を確認してください。

            ハーネスが持つ overlay を変換後の本文に適用し、再生成と上流のずれの検出を検証しています。overlay の基にした上流ファイルが変わった同期は PR を作らず、Issue「superpowers upstream drift」を作るか更新します。

            このPRは `fix(superpowers):` コミットとしてマージされ、release-please が自動で patch リリースに含めます。
          branch: chore/sync-superpowers
          commit-message: "fix(superpowers): sync skills to v${{ steps.latest.outputs.version }}"
          labels: superpowers-sync
