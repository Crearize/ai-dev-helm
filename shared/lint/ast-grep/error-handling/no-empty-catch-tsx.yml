# Detects catch clauses whose block contains no REAL statement. A body is
# still "empty" when it holds only no-op filler: a comment, a bare `;`
# (empty_statement), or a do-nothing expression statement (`null;`,
# `undefined;`, `void 0;`). The inner `pattern: $STMT` matches any named node,
# so the block is counted non-empty only when it has a direct child that is a
# statement AND is none of those no-op shapes. A catch that logs, rethrows,
# returns a fallback, or does any real work is not flagged.
# Languages: valid in TypeScript, TSX and plain JavaScript -> -ts / -tsx / -js
# variants with identical rule bodies.
# Variant: Tsx build of no-empty-catch-ts - identical rule body; see no-empty-catch-ts.yml for the full rationale and language notes.
id: no-empty-catch-tsx
language: Tsx
severity: error
message: "Empty catch block swallows the error (a comment or bare `;`/`null;` is still empty). Handle it, rethrow it, or log with context. (Catalog: A3)"
rule:
  kind: catch_clause
  has:
    kind: statement_block
    not:
      has:
        pattern: $STMT
        not:
          any:
            - kind: comment
            - kind: empty_statement
            - kind: expression_statement
              regex: "^(null|undefined|void\\s+0)\\s*;?$"
