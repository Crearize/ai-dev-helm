# Detects broken cryptographic primitives obtained from the JCA factory
# methods. Covered forms (each matched with its own constraints regex on the
# literal algorithm argument, case-insensitively):
#   - MessageDigest.getInstance("MD5" | "SHA-1" | "SHA1")  -> broken digest
#   - Mac.getInstance("HmacMD5" | "HmacSHA1")              -> broken MAC
#   - Signature.getInstance("...SHA1..." | "...MD5...")    -> broken signature
#   - Cipher.getInstance("DES..." | "...ECB...")           -> weak cipher / mode
# Conservative: only a literal argument is matched; an algorithm name held in
# a variable or constant is out of scope for a pure-AST rule. SHA-256/512,
# HmacSHA256, SHA256withRSA and AES/GCM are near-misses that must NOT fire.
id: no-weak-hash-java
language: Java
severity: error
message: "Broken crypto primitive: MD5/SHA-1 digest or HMAC, a SHA-1/MD5 signature, or a DES/ECB cipher. Use SHA-256+, HmacSHA256, an RSA/ECDSA-SHA256 signature, or AES-GCM. (Catalog: B2)"
rule:
  kind: method_invocation
  any:
    - pattern: MessageDigest.getInstance($ALGO)
    - pattern: MessageDigest.getInstance($ALGO, $PROVIDER)
    - pattern: Mac.getInstance($MAC)
    - pattern: Mac.getInstance($MAC, $MPROVIDER)
    - pattern: Signature.getInstance($SIG)
    - pattern: Signature.getInstance($SIG, $SPROVIDER)
    - pattern: Cipher.getInstance($CIPHER)
    - pattern: Cipher.getInstance($CIPHER, $CPROVIDER)
constraints:
  ALGO:
    regex: "^\"(?i:md5|sha-?1)\"$"
  MAC:
    regex: "^\"(?i:hmac(md5|sha-?1))\"$"
  SIG:
    regex: "(?i:sha-?1|md5)"
  CIPHER:
    regex: "^\"(?i:des(ede)?(/.*)?|.*ecb.*)\"$"
