# Detects MD5 / SHA-1 hashing via createHash. The receiver is left open, so
# `crypto.createHash('md5')`, `nodeCrypto.createHash("md5")` and an imported
# bare `createHash('md5')` are all covered. The algorithm name is matched
# with a `constraints` regex on the argument node so both quote styles and
# the common spellings (md5 / MD5 / sha1 / SHA-1) are handled in one rule.
# Conservative by design - only a literal argument is matched; an algorithm
# name held in a variable is out of scope for a pure AST rule.
id: no-weak-hash-ts
language: TypeScript
severity: error
message: "MD5 and SHA-1 are broken for security use. Use SHA-256 or better, or a password KDF such as bcrypt/argon2. (Catalog: B2)"
rule:
  kind: call_expression
  any:
    - pattern: createHash($ALGO)
    - pattern: $RECV.createHash($ALGO)
constraints:
  ALGO:
    regex: "^['\"](?i:md5|sha-?1)['\"]$"
