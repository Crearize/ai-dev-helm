# Detects a string literal that IS an IPv4 address (the whole literal, not an
# address embedded in a longer sentence). Pure AST cannot express "an IPv4
# address except the reserved ones", so the rule pairs a `kind: string`
# matcher with a `regex` on the node text: the first alternative anchors a
# full dotted quad, and a `not` branch removes the addresses that are never
# environment-specific - 127.0.0.1 (loopback), 0.0.0.0 (wildcard bind) and
# 255.255.255.255 (broadcast). Octet ranges are only loosely validated (0-255
# per octet) which is deliberate: over-precision here buys nothing and costs
# readability.
id: no-hardcoded-ip-ts
language: TypeScript
severity: error
message: "Hardcoded IPv4 address ties the code to one environment. Move it to configuration or an environment variable. (Catalog: C6)"
rule:
  kind: string
  all:
    - regex: "^['\"]((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])['\"]$"
    - not:
        regex: "^['\"](127\\.0\\.0\\.1|0\\.0\\.0\\.0|255\\.255\\.255\\.255)['\"]$"
